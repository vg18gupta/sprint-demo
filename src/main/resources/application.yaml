spring:
  application:
    name: spring-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/springdemo
    username: demo_user
    password: demo_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 7070